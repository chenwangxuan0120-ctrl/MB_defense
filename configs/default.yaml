# MB-Defense 默认配置

# 模型配置
model:
  target_model_path: "/root/models/llama2-7b-chat"
  embedding_model: "all-MiniLM-L6-v2"
  device: "cuda"
  max_new_tokens: 256

# 轻量预筛选 (Module 1)
lightweight_filter:
  enabled: true
  ppl_threshold: 200.0        # PPL高于此值视为高风险
  length_threshold: 500       # prompt长度阈值
  special_char_ratio: 0.3     # 特殊字符比例阈值

# 多视角Backtranslation (Module 2)
multi_perspective:
  num_perspectives: 3         # 视角数量 N
  temperature: 0.7
  max_new_tokens: 256

# 语义偏离校验 + 投票 (Module 3)
semantic_divergence:
  alpha: 0.6                  # 拒绝比例权重
  beta: 0.4                   # 语义偏离度权重
  threshold: 0.5              # 最终判定阈值

# 实验配置
experiment:
  attacks:
    - "gcg"
    - "pair"
    - "autodan"
    - "deepinception"
  num_samples: 50             # 每种攻击的样本数（调试用，正式实验改为全量）
  output_dir: "results/"
  seed: 42
