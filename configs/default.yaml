# MB-Defense: Multi-Perspective Backtranslation with Intent Consistency Verification
# Default Configuration

# 模型配置
model:
  target_model_path: "/root/models/llama2-7b-chat"
  embedding_model: "all-MiniLM-L6-v2"
  device: "cuda"
  max_new_tokens: 256

# Module 1: Adaptive Invocation Strategy
# 根据 prompt ambiguity 决定验证强度 (不会直接放行)
lightweight_filter:
  enabled: true
  ppl_threshold: 200.0
  length_threshold: 500
  special_char_ratio: 0.3

# Module 2: Multi-Perspective Backtranslation
multi_perspective:
  num_perspectives: 3         # 默认视角数 (filter 可能调整为 1)
  temperature: 0.7
  max_new_tokens: 256

# Module 3: Intent Consistency Verification
# Score = alpha * refusal_ratio + beta * intent_entropy + gamma * surface_intent_gap
semantic_divergence:
  alpha: 0.4                  # 拒绝比例权重
  beta: 0.35                  # intent entropy 权重
  gamma: 0.25                 # surface-intent gap 权重
  threshold: 0.45             # 判定阈值

# 实验配置
experiment:
  attacks:
    - "gcg"
    - "pair"
    - "deepinception"
  num_samples: 50
  output_dir: "results/"
  seed: 42
